version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: oasis-mysql-dev
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: oasis_dev
      MYSQL_USER: oasis_user
      MYSQL_PASSWORD: oasis_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_dev_data:/var/lib/mysql
    networks:
      - oasis-dev-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: oasis-redis-dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
    networks:
      - oasis-dev-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: oasis-app-dev
    restart: unless-stopped
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:9000
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: oasis_dev
      DB_USERNAME: oasis_user
      DB_PASSWORD: oasis_password
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QUEUE_CONNECTION: sync
      CACHE_DRIVER: redis
      SESSION_DRIVER: redis
      FRONTEND_URL: http://localhost:5173
    ports:
      - "9000:9000"
    volumes:
      - ./backend:/var/www/html
      - ./backend/storage:/var/www/html/storage
      - ./backend/bootstrap/cache:/var/www/html/bootstrap/cache
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - oasis-dev-network
    command: php artisan serve --host=0.0.0.0 --port=9000
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    image: node:18-alpine
    container_name: oasis-frontend-dev
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:9000
      VITE_APP_NAME: "Oasis Trace"
      VITE_APP_ENV: development
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    networks:
      - oasis-dev-network

volumes:
  mysql_dev_data:
  redis_dev_data:

networks:
  oasis-dev-network:
    driver: bridge
