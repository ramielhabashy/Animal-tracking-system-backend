[phases.setup]
nixPkgs = ["php82", "php82Extensions.mbstring", "php82Extensions.xml", "php82Extensions.curl", "php82Extensions.zip", "php82Extensions.gd", "php82Extensions.tokenizer", "php82Extensions.fileinfo", "composer"]

[phases.build]
dependsOn = ["setup"]
cmds = [
  "cd backend && COMPOSER_ALLOW_SUPERUSER=1 composer install --no-dev --optimize-autoloader --no-scripts",
  "cd frontend && npm install && npm run build"
]

[variables]
COMPOSER_ALLOW_SUPERUSER = "1"

[start]
cmd = "cd backend && php artisan serve --host=0.0.0.0 --port=${PORT:-8000}"
