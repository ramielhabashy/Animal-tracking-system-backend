name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: oasis_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
    - uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: mbstring, pdo, pdo_mysql, redis
        coverage: xdebug

    - name: Copy .env
      run: cp backend/.env.example backend/.env

    - name: Generate APP_KEY
      working-directory: ./backend
      run: php artisan key:generate

    - name: Install Composer dependencies
      working-directory: ./backend
      run: composer install --no-interaction --prefer-dist --optimize-autoloader

    - name: Run migrations
      working-directory: ./backend
      env:
        DB_HOST: 127.0.0.1
        DB_PORT: 3306
        DB_DATABASE: oasis_test
        DB_USERNAME: root
        DB_PASSWORD: root
        QUEUE_CONNECTION: redis
        REDIS_HOST: 127.0.0.1
      run: php artisan migrate --force

    - name: Run tests with coverage
      working-directory: ./backend
      env:
        DB_HOST: 127.0.0.1
        DB_PORT: 3306
        DB_DATABASE: oasis_test
        DB_USERNAME: root
        DB_PASSWORD: root
        QUEUE_CONNECTION: redis
        REDIS_HOST: 127.0.0.1
      run: php artisan test --coverage

  frontend-tests:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      working-directory: ./frontend
      run: npm ci

    - name: Run linter
      working-directory: ./frontend
      run: npm run lint || true

    - name: Run typecheck
      working-directory: ./frontend
      run: npm run typecheck || true

    - name: Run tests
      working-directory: ./frontend
      run: npm run test:run

    - name: Build
      working-directory: ./frontend
      run: npm run build

  e2e-tests:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: ra_animal_tracking_testing
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
    - uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: mbstring, pdo, pdo_mysql

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install PHP dependencies
      working-directory: ./backend
      run: composer install --no-interaction --prefer-dist --optimize-autoloader

    - name: Install Node dependencies
      working-directory: ./frontend
      run: npm ci

    - name: Build frontend
      working-directory: ./frontend
      run: npm run build

    - name: Seed database
      working-directory: ./backend
      env:
        DB_HOST: 127.0.0.1
        DB_PORT: 3306
        DB_DATABASE: ra_animal_tracking_testing
        DB_USERNAME: root
        DB_PASSWORD: root
      run: |
        php artisan migrate --force
        php artisan db:seed --force

    - name: Start Laravel server
      working-directory: ./backend
      env:
        DB_HOST: 127.0.0.1
        DB_PORT: 3306
        DB_DATABASE: ra_animal_tracking_testing
        DB_USERNAME: root
        DB_PASSWORD: root
      run: php artisan serve --port=8050 --no-reload &

    - name: Wait for Laravel
      run: npx wait-on http://localhost:8050/api/auth/login --timeout 30000

    - name: Install Playwright browsers
      working-directory: ./frontend
      run: npx playwright install chromium

    - name: Run e2e tests
      working-directory: ./frontend
      env:
        CI: true
      run: npx playwright test --project=chromium

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build backend image
      run: docker build -f backend/Dockerfile -t oasis-backend:latest .

    - name: Build frontend image
      run: docker build -f frontend/Dockerfile -t oasis-frontend:latest ./frontend

    - name: Test Docker compose
      run: docker-compose config
