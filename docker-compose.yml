version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: oasis-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-changeme_root}
      MYSQL_DATABASE: ${DB_DATABASE:-oasis_production}
      MYSQL_USER: ${DB_USERNAME:-oasis_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-changeme_db}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - oasis-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: oasis-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - oasis-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: oasis-app
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-oasis_production}
      DB_USERNAME: ${DB_USERNAME:-oasis_user}
      DB_PASSWORD: ${DB_PASSWORD:-changeme_db}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-redis}
      CACHE_DRIVER: redis
      SESSION_DRIVER: redis
      STRIPE_KEY: ${STRIPE_KEY}
      STRIPE_SECRET: ${STRIPE_SECRET}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      FRONTEND_URL: ${FRONTEND_URL}
    ports:
      - "9000:9000"
    volumes:
      - ./backend/storage:/var/www/html/storage
      - ./backend/bootstrap/cache:/var/www/html/bootstrap/cache
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - oasis-network
    command: php-fpm

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: oasis-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    networks:
      - oasis-network

  nginx:
    image: nginx:alpine
    container_name: oasis-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./backend:/var/www/html
      - ./backend/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./certs:/etc/nginx/certs
    depends_on:
      - app
      - frontend
    networks:
      - oasis-network

  queue:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: oasis-queue
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-oasis_production}
      DB_USERNAME: ${DB_USERNAME:-oasis_user}
      DB_PASSWORD: ${DB_PASSWORD:-changeme_db}
      REDIS_HOST: redis
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-redis}
    command: php artisan queue:work --tries=3 --timeout=90
    depends_on:
      - mysql
      - redis
    networks:
      - oasis-network

volumes:
  mysql_data:
  redis_data:

networks:
  oasis-network:
    driver: bridge
