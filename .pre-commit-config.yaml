repos:
  - repo: https://github.com/FHPythonUtils/flake8
    rev: 3.11.0
    hooks:
      - id: flake8
        additional_dependencies:
          - flake8-annotations
          - flake8-builtins
          - flake8-comprehensions
          - flake8-debugger
          - flake8-isort
          - flake8-quotes
        args:
          - --max-line-length=120

  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v10.2.0
    hooks:
      - id: eslint
        files: ^frontend/resources/js/
        args: [--fix]

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        files: ^frontend/resources/js/.*\.(js|jsx|ts|tsx|json|css|scss)$

  - repo: local
    hooks:
      - id: php-cs-fixer
        name: PHP CS Fixer
        description: Checks PHP files against the PSR-12 coding standard
        entry: php
        language: system
        args: [backend/vendor/bin/php-cs-fixer, fix, --dry-run, --diff]
        files: ^backend/(app|config|database|routes|tests)/.*\.php$
        exclude: ^backend/(vendor|storage|bootstrap|public)/

      - id: laravel-pint
        name: Laravel Pint
        description: Laravel Pint is an opinionated PHP code style fixer
        entry: php
        language: system
        args: [backend/vendor/bin/pint, --test]
        files: ^backend/(app|config|database|routes|tests)/.*\.php$
        exclude: ^backend/(vendor|storage|bootstrap|public)/

      - id: flutter-format
        name: Flutter Format
        description: Checks Dart files are formatted according to Flutter style
        entry: flutter
        language: system
        args: [format, --output=none, --set-exit-if-changed]
        files: ^mobile/.*\.dart$
        # Disabled until mobile directory is created
        exclude: '.*'
